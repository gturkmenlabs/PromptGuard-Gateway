    <text x="120" y="70" font-family="'SF Mono', monospace" font-size="9" fill="#10b981">✓</text>
    <text x="133" y="70" font-family="'SF Mono', monospace" font-size="9" fill="#94a3b8">GDPR</text>
    <text x="15" y="88" font-family="'SF Mono', monospace" font-size="9" fill="#10b981">✓</text>
    <text x="28" y="88" font-family="'SF Mono', monospace" font-size="9" fill="#94a3b8">HIPAA</text>
