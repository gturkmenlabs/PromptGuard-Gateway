    <!-- Mini demo -->
    <text x="15" y="72" font-family="'SF Mono', monospace" font-size="9" fill="#ef4444">sk-live-4eC39...</text>
    <text x="100" y="72" font-family="'SF Mono', monospace" font-size="9" fill="#475569">→</text>
    <text x="115" y="72" font-family="'SF Mono', monospace" font-size="9" fill="#10b981">[SYN_TOKEN_4912]</text>
    <text x="15" y="88" font-family="'SF Mono', monospace" font-size="9" fill="#ef4444">john@acme.co</text>
    <text x="100" y="88" font-family="'SF Mono', monospace" font-size="9" fill="#475569">→</text>
    <text x="115" y="88" font-family="'SF Mono', monospace" font-size="9" fill="#10b981">[SYN_EMAIL_001]</text>
