    <pattern id="gridF" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.3" opacity="0.3"/>
    </pattern>
    <filter id="glowF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="900" height="320" fill="url(#bgF)"/>
  <rect width="900" height="320" fill="url(#gridF)"/>

  <text x="450" y="30" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#64748b" font-weight="600" letter-spacing="3">KEY FEATURES</text>

