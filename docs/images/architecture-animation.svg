<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" fill="none">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="gridA" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.3" opacity="0.3"/>
    </pattern>
    <filter id="glowA" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="dataFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="900" height="280" fill="url(#bgA)"/>
  <rect width="900" height="280" fill="url(#gridA)"/>

  <text x="450" y="25" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#64748b" font-weight="600" letter-spacing="3">ARCHITECTURE AND DATA FLOW</text>

  <!-- User Node -->
  <g transform="translate(65, 130)">
    <circle cx="0" cy="0" r="30" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- User icon -->
    <circle cx="0" cy="-8" r="7" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    <path d="M -12 15 Q -12 5 0 3 Q 12 5 12 15" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="0" y="50" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#94a3b8">Enterprise</text>
    <text x="0" y="62" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#94a3b8">User</text>
  </g>

  <!-- Arrow: User -> Browser -->
  <g>
    <line x1="100" y1="130" x2="155" y2="130" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/>
    </line>
    <polygon points="155,125 165,130 155,135" fill="#64748b"/>
  </g>

  <!-- Browser Node -->
  <g transform="translate(210, 130)">
    <rect x="-35" y="-30" width="70" height="60" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Browser icon -->
    <circle cx="0" cy="-5" r="12" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
    <line x1="-12" y1="-5" x2="12" y2="-5" stroke="#3b82f6" stroke-width="0.8"/>
    <line x1="0" y1="-17" x2="0" y2="7" stroke="#3b82f6" stroke-width="0.8"/>
    <ellipse cx="0" cy="-5" rx="5" ry="12" fill="none" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="0" y="15" text-anchor="middle" font-family="'SF Mono', monospace" font-size="8" fill="#60a5fa">Browser</text>
    <text x="0" y="50" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#94a3b8">AI Client</text>
  </g>

  <!-- Branch: Three protection modes -->
  <!-- Arrow to Extension -->
  <path d="M 245 115 Q 280 60 310 60" stroke="#10b981" stroke-width="1.5" fill="none" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <polygon points="310,55 320,60 310,65" fill="#10b981"/>

  <!-- Arrow to HTTPS Proxy -->
  <line x1="245" y1="130" x2="310" y2="130" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.2s" repeatCount="indefinite" begin="0.2s"/>
  </line>
  <polygon points="310,125 320,130 310,135" fill="#f59e0b"/>

  <!-- Arrow to Web SDK -->
  <path d="M 245 145 Q 280 200 310 200" stroke="#8b5cf6" stroke-width="1.5" fill="none" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.2s" repeatCount="indefinite" begin="0.4s"/>
  </path>
  <polygon points="310,195 320,200 310,205" fill="#8b5cf6"/>

  <!-- Extension Mode -->
  <g transform="translate(375, 60)">
    <rect x="-50" y="-25" width="100" height="50" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="-5" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#10b981" font-weight="600">MV3</text>
    <text x="0" y="8" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#10b981" font-weight="600">Extension</text>
    <text x="0" y="42" text-anchor="middle" font-family="'SF Mono', monospace" font-size="8" fill="#475569">Content Script</text>
  </g>

  <!-- HTTPS Proxy Mode -->
  <g transform="translate(375, 130)">
    <rect x="-50" y="-25" width="100" height="50" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" begin="0.3s"/>
    </rect>
    <text x="0" y="-5" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#f59e0b" font-weight="600">HTTPS</text>
    <text x="0" y="8" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#f59e0b" font-weight="600">Proxy</text>
    <text x="0" y="42" text-anchor="middle" font-family="'SF Mono', monospace" font-size="8" fill="#475569">:9120 Loopback</text>
  </g>

  <!-- Web SDK Mode -->
  <g transform="translate(375, 200)">
    <rect x="-50" y="-25" width="100" height="50" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
    </rect>
    <text x="0" y="-5" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#8b5cf6" font-weight="600">Web</text>
    <text x="0" y="8" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#8b5cf6" font-weight="600">SDK</text>
    <text x="0" y="42" text-anchor="middle" font-family="'SF Mono', monospace" font-size="8" fill="#475569">Client-side JS</text>
  </g>

  <!-- All three converge to DLP Engine -->
  <path d="M 425 60 Q 470 60 490 110" stroke="#10b981" stroke-width="1" fill="none" opacity="0.6"/>
  <line x1="425" y1="130" x2="490" y2="130" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <path d="M 425 200 Q 470 200 490 150" stroke="#8b5cf6" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- DLP Engine (Central) -->
  <g transform="translate(545, 130)">
    <rect x="-50" y="-35" width="100" height="70" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#glowA)">
      <animate attributeName="stroke" values="#10b981;#06b6d4;#10b981" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- Shield inside -->
    <path d="M 0 -20 L 14 -13 L 14 0 Q 14 14 0 20 Q -14 14 -14 0 L -14 -13 Z" fill="none" stroke="#10b981" stroke-width="1.5">
      <animate attributeName="stroke" values="#10b981;#06b6d4;#10b981" dur="4s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="-2" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" fill="#10b981" font-weight="700">DLP</text>
    <text x="0" y="10" text-anchor="middle" font-family="'SF Mono', monospace" font-size="8" fill="#94a3b8">Engine</text>
    <!-- Pulse -->
    <rect x="-50" y="-35" width="100" height="70" rx="10" fill="none" stroke="#10b981" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="-50;-55;-50" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-35;-40;-35" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="width" values="100;110;100" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="height" values="70;80;70" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- DLP -> BLOCK -->
  <path d="M 595 110 Q 630 70 660 70" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="3 3">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(710, 70)">
    <rect x="-40" y="-18" width="80" height="36" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="0" y="-2" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#ef4444" font-weight="700">BLOCK</text>
    <text x="0" y="10" text-anchor="middle" font-family="'SF Mono', monospace" font-size="7" fill="#475569">403 Rejected</text>
    <!-- X icon -->
    <circle cx="30" cy="-10" r="5" fill="#ef4444" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- DLP -> MASK -> LLM -->
  <line x1="595" y1="130" x2="660" y2="130" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/>
  </line>
  <polygon points="660,125 670,130 660,135" fill="#10b981"/>

  <!-- LLM Cloud -->
  <g transform="translate(730, 130)">
    <rect x="-50" y="-30" width="100" height="60" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="-8" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" fill="#06b6d4" font-weight="700">External</text>
    <text x="0" y="5" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" fill="#06b6d4" font-weight="700">LLM</text>
    <text x="0" y="18" text-anchor="middle" font-family="'SF Mono', monospace" font-size="7" fill="#475569">Sanitized only</text>
  </g>

  <!-- Return arrow (LLM -> Re-hydrate -> User) -->
  <path d="M 730 165 Q 730 220 400 240 Q 100 250 65 175" stroke="#06b6d4" stroke-width="1" fill="none" stroke-dasharray="6 4" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/>
  </path>
  <text x="400" y="255" text-anchor="middle" font-family="'SF Mono', monospace" font-size="8" fill="#06b6d4" opacity="0.6">← Response re-hydration (local token restoration) ←</text>

  <!-- Bottom border -->
  <line x1="50" y1="275" x2="850" y2="275" stroke="#1e293b" stroke-width="0.5"/>
</svg>
