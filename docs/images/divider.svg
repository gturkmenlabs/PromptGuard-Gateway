<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 12" fill="none">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="20%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="50" y="5" width="800" height="1.5" fill="url(#divGrad)" rx="1">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Animated dot traveling along the line -->
  <circle cy="6" r="3" fill="#10b981" opacity="0.8">
    <animate attributeName="cx" values="50;850" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#10b981;#06b6d4;#8b5cf6" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
